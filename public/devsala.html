<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Pede ao navegador para conferir se há versão nova em cada carregamento, em
     vez de servir o arquivo guardado. Evita ter que pedir Ctrl+Shift+R para
     todo mundo depois de publicar. O cabeçalho HTTP da Vercel manda mais que
     isto, mas os dois apontam para o mesmo lado. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<!-- SALA-VERSAO: v2 · 2026-08-18 — desempenho, estabilidade e placa de captura -->
<title>Sala</title>
<style>
  :root{
    --bg-deep:#141219;
    --bg-rail:#1a1720;
    --bg-side:#1f1c27;
    --bg-main:#242030;
    --bg-input:#2c2837;
    --bg-hover:#332e40;
    --border:#332f3d;
    --text-hi:#f3f1f7;
    --text-mid:#c9c4d4;
    --text-low:#8d879c;
    --accent:#ff9f5b;
    --accent-dim:#7a5334;
    --online:#5fd98a;
    --green:#3ba55d;
    --red:#ed4245;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-ui);
    background:var(--bg-deep);
    color:var(--text-hi);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{ height:100vh; width:100%; display:flex; }

  /* ---------- GATE (nickname) ---------- */
  #gate{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 20%, #2a2436 0%, var(--bg-deep) 60%);
    z-index:50;
  }
  #gate .card{
    width:340px; background:var(--bg-side); border:1px solid var(--border);
    border-radius:16px; padding:32px 28px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  #gate .dot{
    width:14px;height:14px;border-radius:50%;background:var(--accent);
    margin:0 auto 16px; box-shadow:0 0 0 6px var(--accent-dim);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 6px var(--accent-dim);}
    50%{box-shadow:0 0 0 10px transparent;}
  }
  #gate h1{ font-size:19px; font-weight:700; margin-bottom:6px; letter-spacing:-0.2px;}
  #gate p{ font-size:13px; color:var(--text-low); margin-bottom:20px; line-height:1.5;}
  #gate input{
    width:100%; padding:11px 14px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg-input); color:var(--text-hi); font-size:14px; outline:none;
    margin-bottom:12px;
  }
  #gate input:focus{ border-color:var(--accent); }
  #gate button{
    width:100%; padding:11px; border-radius:8px; border:none; cursor:pointer;
    background:var(--accent); color:#1a1210; font-weight:700; font-size:14px;
    transition:filter .15s;
  }
  #gate button:hover{ filter:brightness(1.08); }
  #gate .err{ color:#ff8484; font-size:12px; margin-top:8px; min-height:14px; }
  #gate .ver{ color:var(--text-low); font-size:10px; margin-top:14px; font-family:var(--font-mono); opacity:.7; }

  /* ---------- PAINEL DE NOVIDADES (só no ambiente de teste) ---------- */
  body.ambiente-dev #gate{ gap:22px; flex-wrap:wrap; padding:24px; align-content:center; }
  #novidades, .novidades-corpo{
    width:400px; max-width:92vw; max-height:78vh; overflow-y:auto;
    background:var(--bg-side); border:1px solid var(--border);
    border-radius:16px; padding:22px 24px; text-align:left;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .novidades-corpo h2{ font-size:13px; font-weight:700; margin-bottom:4px; }
  .novidades-corpo .sub{ font-size:11px; color:var(--text-low); margin-bottom:16px; line-height:1.5; }
  .novidades-corpo .grupo{ margin-bottom:15px; }
  .novidades-corpo .grupo:last-of-type{ margin-bottom:0; }
  .novidades-corpo .grupo h3{
    font-size:10px; text-transform:uppercase; letter-spacing:.7px;
    color:var(--accent); margin-bottom:7px; font-weight:700;
  }
  .novidades-corpo ul{ list-style:none; display:flex; flex-direction:column; gap:6px; }
  .novidades-corpo li{
    font-size:12px; color:var(--text-mid); line-height:1.5;
    padding-left:15px; position:relative;
  }
  .novidades-corpo li::before{ content:'▸'; position:absolute; left:0; top:0; color:var(--text-low); }
  .novidades-corpo li b{ color:var(--text-hi); font-weight:600; }
  .novidades-corpo .rodape{
    margin-top:16px; padding-top:12px; border-top:1px solid var(--border);
    font-size:10px; color:var(--text-low); font-family:var(--font-mono); line-height:1.7;
  }

  /* ---------- BASE DAS JANELAS FLUTUANTES ---------- */
  .modal{
    position:fixed; inset:0; z-index:110;
    background:rgba(10,8,14,0.65);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal.hidden{ display:none; }
  .modal-card{
    width:440px; max-width:94vw; max-height:88vh;
    background:var(--bg-side); border:1px solid var(--border);
    border-radius:14px; overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,0.55);
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--border);
    font-weight:700; font-size:14px;
  }
  .modal-close{ cursor:pointer; color:var(--text-low); font-size:16px; line-height:1; padding:2px 4px; }
  .modal-close:hover{ color:var(--text-hi); }

  #modal-novidades .modal-card{ width:520px; max-height:82vh; display:flex; flex-direction:column; }
  #modal-novidades .novidades-corpo{
    width:auto; max-width:none; max-height:none; border:none; border-radius:0;
    box-shadow:none; background:transparent; overflow-y:auto; padding:20px 24px;
  }

  /* ---------- MARCA DE AMBIENTE DE TESTE ---------- */
  /* Só aparece quando o arquivo não é o sala.html. Serve para ninguém achar
     que está na sala de verdade e mandar recado para o vazio. */
  .dev-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:#4a2430; color:#ffb4b4; border:1px solid #6b3340;
    font-size:10px; font-weight:800; letter-spacing:.9px; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; font-family:var(--font-ui);
  }
  #gate .dev-badge{ margin-bottom:14px; }
  #server-name .dev-badge{ font-size:9px; padding:2px 7px; letter-spacing:.6px; }
  body.ambiente-dev #rail .server-icon{ background:#ed4245; color:#fff; }
  body.ambiente-dev #rail::after{
    content:'DEV'; font-size:9px; font-weight:800; color:#ff9d9d;
    letter-spacing:1px; margin-top:-4px;
  }
  body.ambiente-dev #main{ box-shadow: inset 0 3px 0 0 #ed4245; }

  /* ---------- RAIL ---------- */
  #rail{
    width:64px; background:var(--bg-rail); flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; padding-top:16px; gap:10px;
  }
  #rail .server-icon{
    width:42px; height:42px; border-radius:14px; background:var(--accent);
    color:#1a1210; font-weight:800; font-family:var(--font-mono);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  #rail .rail-line{ width:26px; height:2px; background:var(--border); border-radius:2px; margin:2px 0; }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:240px; background:var(--bg-side); flex-shrink:0;
    display:flex; flex-direction:column; border-right:1px solid var(--border);
  }
  #server-name{
    padding:16px 16px 12px; font-weight:700; font-size:15px;
    border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
  }
  #server-name .edit-btn{ cursor:pointer; color:var(--text-low); font-size:12px; }
  #server-name .edit-btn:hover{ color:var(--accent); }
  #server-name input{
    background:var(--bg-input); border:1px solid var(--accent); border-radius:6px;
    color:var(--text-hi); font-size:14px; padding:4px 8px; width:100%; outline:none;
  }
  #scroll-area{ flex:1; overflow-y:auto; }
  .section-header{
    padding:14px 14px 6px; font-size:11px; text-transform:uppercase; letter-spacing:0.6px;
    color:var(--text-low); display:flex; justify-content:space-between; align-items:center;
  }
  .section-header .add{
    cursor:pointer; color:var(--text-low); font-size:16px; line-height:1; padding:0 4px;
  }
  .section-header .add:hover{ color:var(--accent); }
  #channel-list, #voice-list{ padding:2px 8px; }
  .channel-item{
    display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:6px;
    cursor:pointer; color:var(--text-mid); font-size:14px; font-family:var(--font-mono);
    margin-bottom:1px;
  }
  .channel-item:hover{ background:var(--bg-hover); color:var(--text-hi); }
  .channel-item.active{ background:var(--bg-hover); color:var(--text-hi); }
  .channel-item .hash{ color:var(--text-low); }
  .channel-item.active .hash{ color:var(--accent); }
  .channel-item .count{ margin-left:auto; font-size:11px; color:var(--text-low); font-family:var(--font-ui); }

  .new-row{ padding:6px 14px 10px; display:none; gap:6px; }
  .new-row.show{ display:flex; }
  .new-row input{
    flex:1; background:var(--bg-input); border:1px solid var(--border); border-radius:6px;
    color:var(--text-hi); font-size:13px; padding:6px 8px; outline:none; font-family:var(--font-mono);
  }
  .new-row input:focus{ border-color:var(--accent); }
  .new-row button{
    background:var(--accent); color:#1a1210; border:none; border-radius:6px;
    padding:0 10px; font-weight:700; cursor:pointer; font-size:13px;
  }

  /* ---------- VOZ ---------- */
  .voice-block{ margin-bottom:2px; }
  .voice-occupants{ padding:1px 0 4px 22px; display:flex; flex-direction:column; gap:1px; }
  .vo-row{
    display:flex; align-items:center; gap:7px; padding:3px 8px; border-radius:5px;
    font-size:12.5px; color:var(--text-mid);
  }
  .vo-row:hover{ background:var(--bg-hover); }
  .vo-row .avatar{
    width:22px; height:22px; font-size:10px; border:2px solid transparent;
    transition:border-color .1s linear;
  }
  .vo-row.speaking .avatar{ border-color:var(--green); }
  .vo-row .vname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vo-row .vicon{ margin-left:auto; font-size:11px; flex-shrink:0; }
  .vo-row .vicon.bad{ color:var(--red); }
  .vo-row .vicon.live{ color:var(--green); }
  .vo-row .vstate{ margin-left:auto; font-size:10px; color:var(--text-low); flex-shrink:0; }

  #call-bar{ display:none; padding:9px 10px; background:#182119; border-top:1px solid var(--border); }
  body.in-call #call-bar{ display:block; }
  #call-bar .call-top{ display:flex; align-items:center; gap:7px; margin-bottom:8px; }
  #call-bar .call-status{ font-size:12.5px; font-weight:700; color:var(--green); }
  #call-bar .call-where{ font-size:11px; color:var(--text-low); font-family:var(--font-mono); }
  #call-bar .hangup{
    margin-left:auto; cursor:pointer; background:#3a1e22; color:#ff9d9d; border:none;
    border-radius:6px; padding:5px 9px; font-size:11px; font-weight:700;
  }
  #call-bar .hangup:hover{ background:#4d262c; }
  #call-bar .call-btns{ display:flex; gap:6px; }
  #call-bar .cbtn{
    flex:1; cursor:pointer; background:var(--bg-input); color:var(--text-mid); border:1px solid var(--border);
    border-radius:6px; padding:7px 4px; font-size:11px; font-weight:600; text-align:center;
  }
  #call-bar .cbtn:hover{ background:var(--bg-hover); color:var(--text-hi); }
  #call-bar .cbtn.on{ background:#3a1e22; color:#ff9d9d; border-color:#5a2c33; }
  #call-bar .cbtn.live{ background:#1e3a26; color:#8ff0ab; border-color:#2c5a38; }

  #user-bar{
    padding:10px 12px; border-top:1px solid var(--border); display:flex; align-items:center; gap:8px;
    background:var(--bg-rail);
  }
  .avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
    color:#1a1210;
  }
  #user-bar .who{ flex:1; overflow:hidden; }
  #user-bar .who .name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #user-bar .who .status{ font-size:11px; color:var(--online); }
  #user-bar .leave{ cursor:pointer; color:var(--text-low); font-size:11px; padding:4px 6px; border-radius:6px; }
  #user-bar .leave:hover{ color:#ff8484; background:var(--bg-hover); }

  /* ---------- MAIN ---------- */
  #main{ flex:1; display:flex; flex-direction:column; background:var(--bg-main); min-width:0; }
  #chat-header{
    height:52px; flex-shrink:0; display:flex; align-items:center; padding:0 18px;
    border-bottom:1px solid var(--border); gap:8px; font-weight:700; font-size:15px;
  }
  #chat-header .hash{ color:var(--text-low); font-family:var(--font-mono); font-weight:400; }
  #chat-header .head-btn{
    font-size:12px; color:var(--text-low); cursor:pointer; font-weight:500;
    display:flex; align-items:center; gap:5px; padding:5px 8px; border-radius:6px;
  }
  #chat-header .head-btn:hover{ color:var(--text-hi); background:var(--bg-hover); }
  #chat-header .head-btn.first{ margin-left:auto; }
  #chat-header .head-btn.live{ color:#8ff0ab; }
  #chat-header .dot-small{ width:7px; height:7px; border-radius:50%; background:var(--online); }

  /* ---------- PALCO (tela compartilhada) ---------- */
  #stage{
    display:none; flex-direction:column; background:#000;
    border-bottom:1px solid var(--border); flex:1 1 62%; min-height:0;
  }
  body.stage-on #stage{ display:flex; }
  body.stage-on #messages{ flex:0 0 30%; }
  body.theater #messages, body.theater #input-row{ display:none; }
  body.theater #stage{ flex:1 1 100%; }

  #stage-bar{
    display:flex; align-items:center; gap:8px; padding:7px 12px;
    background:var(--bg-rail); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  #stage-title{ font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; min-width:0; }
  #stage-title .rec{ width:8px; height:8px; border-radius:50%; background:var(--red); flex-shrink:0; }
  #stage-title .audio-tag{
    font-size:10px; font-weight:600; padding:2px 7px; border-radius:20px; white-space:nowrap;
    background:var(--bg-input); color:var(--text-low); border:1px solid var(--border);
  }
  #stage-title .audio-tag.ok{ background:#1e3a26; color:#8ff0ab; border-color:#2c5a38; }
  #stage-title .audio-tag.alerta{ background:#3a2a18; color:#ffc98f; border-color:#5c4425; }
  #stage-tabs{ display:flex; gap:5px; overflow-x:auto; }
  #stage-tabs .stab{
    cursor:pointer; font-size:11px; padding:4px 9px; border-radius:6px;
    background:var(--bg-input); color:var(--text-mid); border:1px solid var(--border); white-space:nowrap;
  }
  #stage-tabs .stab.active{ background:var(--accent); color:#1a1210; border-color:var(--accent); font-weight:700; }
  #stage-actions{ margin-left:auto; display:flex; gap:5px; flex-shrink:0; }
  #stage-actions .sbtn{
    cursor:pointer; font-size:11px; padding:5px 9px; border-radius:6px;
    background:var(--bg-input); color:var(--text-mid); border:1px solid var(--border);
  }
  #stage-actions .sbtn:hover{ background:var(--bg-hover); color:var(--text-hi); }
  #stage-actions .sbtn.on{ background:var(--accent); color:#1a1210; border-color:var(--accent); font-weight:700; }

  #stage-video-wrap{ flex:1; position:relative; min-height:0; background:#000; }
  #stage-video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  #stage-status{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--text-low); font-size:13px; text-align:center; padding:20px; pointer-events:none;
    background:rgba(0,0,0,0.55); white-space:pre-line;
  }
  #stage-status.show{ display:flex; }

  #messages{ flex:1; overflow-y:auto; padding:16px 20px 8px; display:flex; flex-direction:column; gap:2px; min-height:0; }
  #messages .empty{
    margin:auto; text-align:center; color:var(--text-low); font-size:13px; max-width:280px; line-height:1.6;
  }
  .msg{ display:flex; gap:12px; padding:6px 4px; border-radius:8px; }
  .msg:hover{ background:rgba(255,255,255,0.02); }
  .msg .avatar{ margin-top:2px; }
  .msg .body{ min-width:0; flex:1; }
  .msg .meta{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .msg .meta .who{ font-size:14px; font-weight:700; }
  .msg .meta .ts{ font-size:11px; color:var(--text-low); font-family:var(--font-mono); }
  .msg .text{ font-size:14px; color:var(--text-mid); line-height:1.5; word-wrap:break-word; white-space:pre-wrap; }

  #input-row{ padding:10px 18px 16px; flex-shrink:0; }
  #input-wrap{
    background:var(--bg-input); border:1px solid var(--border); border-radius:10px;
    display:flex; align-items:center; padding:4px 6px 4px 14px;
  }
  #input-wrap:focus-within{ border-color:var(--accent); }
  #msg-input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text-hi);
    font-size:14px; padding:10px 6px; font-family:var(--font-ui);
  }
  #msg-input::placeholder{ color:var(--text-low); }
  #send-btn{
    background:var(--accent); color:#1a1210; border:none; border-radius:7px; padding:8px 14px;
    font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0;
  }
  #send-btn:hover{ filter:brightness(1.08); }

  /* ---------- MEMBROS ---------- */
  #members-panel{
    width:200px; background:var(--bg-side); border-left:1px solid var(--border);
    flex-shrink:0; display:flex; flex-direction:column;
  }
  #members-panel.hidden{ display:none; }
  #members-panel h3{
    padding:16px 14px 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-low);
  }
  #members-list{ overflow-y:auto; padding:0 10px; display:flex; flex-direction:column; gap:2px; }
  .member-row{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; }
  .member-row:hover{ background:var(--bg-hover); }
  .member-row .avatar{ width:26px; height:26px; font-size:11px; position:relative; }
  .member-row .status-dot{
    width:9px; height:9px; border-radius:50%; position:absolute; bottom:-1px; right:-1px;
    border:2px solid var(--bg-side);
  }
  .member-row .status-dot.on{ background:var(--online); }
  .member-row .status-dot.off{ background:var(--text-low); }
  .member-row .mname{ font-size:13px; color:var(--text-mid); }
  .member-row.on .mname{ color:var(--text-hi); }

  #audio-sink{ position:absolute; width:0; height:0; overflow:hidden; }

  #menu-tela{
    position:fixed; z-index:120; width:284px; background:var(--bg-side);
    border:1px solid var(--border); border-radius:10px; overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,0.5);
  }
  #menu-tela .mt-op{ padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--border); }
  #menu-tela .mt-op:last-child{ border-bottom:none; }
  #menu-tela .mt-op:hover{ background:var(--bg-hover); }
  #menu-tela .mt-op b{ display:block; font-size:13px; margin-bottom:3px; }
  #menu-tela .mt-op span{ display:block; font-size:11px; color:var(--text-low); line-height:1.45; }
  #menu-tela .mt-op[data-modo="aba"] b{ color:#8ff0ab; }
  #menu-tela .mt-op[data-modo="tela"] b{ color:#ffc98f; }
  #menu-tela .mt-op[data-modo="captura"] b{ color:#9fc9ff; }

  #modal-captura .modal-card{ width:440px; }
  #modal-captura .linha{ margin-bottom:14px; }
  #modal-captura label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--text-low); margin-bottom:6px; font-weight:700;
  }
  #modal-captura select{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg-input); color:var(--text-hi); font-size:13px; outline:none;
  }
  #modal-captura select:focus{ border-color:var(--accent); }
  #modal-captura .previa{ margin-bottom:12px; }
  #modal-captura .previa video{
    width:100%; aspect-ratio:16/9; background:#000; border-radius:8px;
    display:block; object-fit:contain; border:1px solid var(--border);
  }
  #modal-captura #cap-estado{
    font-size:11px; color:var(--text-low); margin-top:6px; line-height:1.5; min-height:16px;
  }
  #modal-captura #cap-estado.ok{ color:#8ff0ab; font-weight:600; }
  #modal-captura #cap-estado.ruim{ color:#ff9d9d; }
  #modal-captura .nota{ font-size:11px; color:var(--text-low); line-height:1.5; margin-bottom:14px; }

<script>
(function(){
  const SB_URL = "https://rwkuklrvppzhyzrtiloe.supabase.co";
  const SB_KEY = "sb_publishable_bUBRlX_BgoM0ACqWyz4WDw_vC4F_OL2";
  const H = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" };
  const REST = SB_URL + "/rest/v1/room_kv";

  // ---------- ESPAÇO DE DADOS POR ARQUIVO ----------
  // Todos os arquivos falam com a mesma tabela room_kv. Sem separar, uma cópia
  // de teste (devsala.html) escreve nas MESMAS chaves da sala de produção e as
  // mensagens aparecem lá. Aqui cada nome de arquivo ganha seu próprio espaço:
  //
  //   sala.html      -> sem prefixo (a sala de produção, dados atuais preservados)
  //   devsala.html   -> prefixo "devsala:"  (isolado)
  //   qualquercoisa.html -> prefixo "qualquercoisa:"
  //
  // Ou seja: basta copiar o arquivo com outro nome e ele já nasce isolado.
  // O espaço de dados é DECLARADO, não deduzido. Deduzir pelo nome do arquivo
  // quebra em hospedagens que mexem no endereço — o Cloudflare Pages, por
  // exemplo, serve /sala.html como /sala, e aí o nome some. Com o valor
  // escrito aqui, o arquivo vai para o lugar certo esteja onde estiver.
  //
  //   "producao"  -> a sala de verdade, sem prefixo
  //   "hmlsala"   -> homologação
  //   "devsala"   -> desenvolvimento
  //   ""          -> (não recomendado) deduz pelo nome do arquivo
  const ESPACO_FORCADO = "devsala";

  const ARQUIVO = (location.pathname.split("/").pop() || "sala.html").toLowerCase();
  const NS = ESPACO_FORCADO === "producao" ? ""
    : ESPACO_FORCADO ? ESPACO_FORCADO + ":"
    : ((ARQUIVO === "sala.html" || ARQUIVO === "") ? "" : ARQUIVO.replace(/\.html?$/, "") + ":");
  window.__SALA_ARQUIVO = ESPACO_FORCADO || ARQUIVO;
  window.__SALA_NS = NS;                                    // "" quando é produção
  window.__SALA_ESPACO = NS ? NS.slice(0, -1) : "producao"; // nome legível do espaço

  // O prefixo entra na ida e sai na volta, então quem chama continua vendo as
  // chaves como sempre — importante porque a sinalização faz split(":") nelas.
  // ---------- RELÓGIO DO SERVIDOR ----------
  // Todo horário que é COMPARADO ENTRE PESSOAS tem que vir de um relógio só.
  // Se cada navegador usar o próprio, quem estiver com a hora errada apaga
  // coisa dos outros e some da lista sem motivo. Toda resposta HTTP traz o
  // cabeçalho Date, então dá para medir o desvio sem pedir nada a mais.
  let desvioRelogio = 0;   // servidor menos cliente, em ms
  function anotarRelogio(r){
    try{
      const d = r.headers.get("Date");
      if (!d) return;
      const t = Date.parse(d);
      if (t) desvioRelogio = t - Date.now();
    }catch(e){}
  }
  window.agoraServidor = () => Date.now() + desvioRelogio;
  window.__anotarRelogio = anotarRelogio;   // para o resto do app também aproveitar
  window.__SALA_DESVIO_RELOGIO = () => Math.round(desvioRelogio / 1000);

  const comNS = (k) => NS + k;
  const semNS = (k) => (NS && k.startsWith(NS) ? k.slice(NS.length) : k);

  window.storage = {
    async get(key, shared){
      if (!shared){
        const v = localStorage.getItem("local:" + NS + key);
        return v === null ? null : { value: v };
      }
      const r = await fetch(REST + "?select=value&key=eq." + encodeURIComponent(comNS(key)), { headers: H });
      anotarRelogio(r);
      if (!r.ok) throw new Error("get failed " + r.status);
      const rows = await r.json();
      return rows.length ? { value: rows[0].value } : null;
    },
    async set(key, value, shared){
      if (!shared){ localStorage.setItem("local:" + NS + key, String(value)); return true; }
      const r = await fetch(REST + "?on_conflict=key", {
        method: "POST",
        headers: { ...H, Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ key: comNS(key), value: String(value), updated_at: new Date().toISOString() })
      });
      anotarRelogio(r);
      if (!r.ok) throw new Error("set failed " + r.status);
      return true;
    },
    async delete(key, shared){
      if (!shared){ localStorage.removeItem("local:" + NS + key); return true; }
      const r = await fetch(REST + "?key=eq." + encodeURIComponent(comNS(key)), {
        method: "DELETE", headers: { ...H, Prefer: "return=minimal" }
      });
      anotarRelogio(r);
      if (!r.ok) throw new Error("delete failed " + r.status);
      return true;
    },
    // Busca várias chaves numa requisição só, e devolve APENAS as que mudaram
    // desde o carimbo informado. Em regime normal ninguém falou nada e a
    // resposta vem vazia — antes baixávamos o histórico inteiro do chat a cada
    // ciclo, por pessoa. O carimbo vem do próprio banco, então relógio
    // desregulado no cliente não atrapalha.
    async getChanged(keys, desde){
      const lista = keys.map(k => '"' + encodeURIComponent(comNS(k)) + '"').join(",");
      let url = REST + "?select=key,value,updated_at&key=in.(" + lista + ")";
      if (desde) url += "&updated_at=gt." + encodeURIComponent(desde);
      const r = await fetch(url, { headers: H });
      anotarRelogio(r);
      if (!r.ok) throw new Error("getChanged failed " + r.status);
      let carimbo = desde || null;
      const valores = {};
      for (const row of await r.json()){
        valores[semNS(row.key)] = row.value;
        if (!carimbo || row.updated_at > carimbo) carimbo = row.updated_at;
      }
      return { valores, carimbo };
    },
    // Busca várias chaves numa requisição só. O laço principal pedia 4 coisas
    // em série; a ~0,5s cada, o ciclo levava o próprio intervalo inteiro para
    // terminar e vivia atrasado.
    async getMany(keys){
      const lista = keys.map(k => '"' + encodeURIComponent(comNS(k)) + '"').join(",");
      const r = await fetch(REST + "?select=key,value&key=in.(" + lista + ")", { headers: H });
      anotarRelogio(r);
      if (!r.ok) throw new Error("getMany failed " + r.status);
      const mapa = {};
      for (const row of await r.json()) mapa[semNS(row.key)] = row.value;
      return mapa;
    },
    // Lê todas as linhas cuja chave começa com `prefix`. É o que permite fazer
    // presença e sinalização sem read-modify-write concorrente numa única chave.
    async list(prefix){
      const r = await fetch(REST + "?select=key,value&key=like." + encodeURIComponent(comNS(prefix) + "*"), { headers: H });
      anotarRelogio(r);
      if (!r.ok) throw new Error("list failed " + r.status);
      const rows = await r.json();
      // Devolve sem o prefixo: a sinalização faz split(":") nessas chaves e
      // contaria os pedaços errado se o namespace viesse junto.
      return rows.map(row => ({ key: semNS(row.key), value: row.value }));
    },
    // Apaga por prefixo o que estiver parado há mais de `ms`. Serve para a
    // sinalização abandonada por quem fecha a aba de repente — o beforeunload
    // não consegue garantir a limpeza das chaves que a pessoa escreveu para os
    // outros, e elas iam acumulando na tabela.
    async deleteOlderThan(prefix, ms){
      const limite = new Date(window.agoraServidor() - ms).toISOString();
      const r = await fetch(REST + "?key=like." + encodeURIComponent(comNS(prefix) + "*") +
        "&updated_at=lt." + encodeURIComponent(limite), {
        method: "DELETE", headers: { ...H, Prefer: "return=minimal" }
      });
      anotarRelogio(r);
      if (!r.ok) throw new Error("deleteOlderThan failed " + r.status);
      return true;
    },
    async deletePrefix(prefix, keepalive){
      const r = await fetch(REST + "?key=like." + encodeURIComponent(comNS(prefix) + "*"), {
        method: "DELETE", headers: { ...H, Prefer: "return=minimal" }, keepalive: !!keepalive
      });
      anotarRelogio(r);
      if (!r.ok) throw new Error("deletePrefix failed " + r.status);
      return true;
    }
  };
})();
</script>

  // Contador de negociação sempre crescente. Um contador que reinicia do zero
  // trava a reconexão: o outro lado já viu um número maior e descarta a oferta
  // nova como se fosse velha.
  let EPOCH = Date.now() % 1000000;
  function nextEpoch(){ return ++EPOCH; }

  // "Encarnação": muda a cada vez que entro na chamada. Como o sessionId não
  // muda sem recarregar a página, é isso que avisa os outros que eu sou uma
  // conexão nova e que o estado antigo do par deve ser jogado fora.
  let INC = 0;

  // ===================== CONFIGURE O TURN AQUI =====================
  // STUN só descobre o próprio IP público; ele não carrega mídia. Quando os
  // dois lados estão atrás de NAT simétrico, firewall corporativo ou CGNAT de
  // operadora, não existe caminho direto e a conexão simplesmente não fecha.
  // O TURN é um relay: a mídia passa por ele quando o caminho direto falha.
  //
  // Preencha e a sala passa a funcionar nessas redes. Sem isso, alguns pares
  // vão aparecer como "falhou" por mais correções que existam no código.
  // OPÇÃO A — credenciais fixas (coturn próprio, ou Cloudflare com TTL longo).
  // Simples, mas ficam visíveis no código-fonte da página.
  const TURN_SERVERS = [
    // { urls: ['turn:SEU-HOST:3478?transport=udp', 'turn:SEU-HOST:3478?transport=tcp'],
    //   username: 'usuario', credential: 'senha' },
    // { urls: 'turns:SEU-HOST:5349?transport=tcp',   // TLS na 5349: atravessa firewall que só libera HTTPS
    //   username: 'usuario', credential: 'senha' },
  ];

  // OPÇÃO B — credenciais de curta duração buscadas num endpoint. É o modo do
  // Cloudflare, e o único que não deixa a senha do relay exposta na página.
  // Aponte para a Edge Function do Supabase que gera as credenciais.
  // Worker do Cloudflare que gera as credenciais TURN de curta duração.
  // Código dele em cloudflare/turn-worker.js.
  //
  // Se um dia esta URL mudar, é só trocar aqui — nada mais no arquivo depende
  // dela. Deixando em branco, a sala volta a funcionar só com STUN.
  const TURN_ENDPOINT = 'https://sala-turn-api.vinicius-petinate.workers.dev';
  // =================================================================

  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' }
  ].concat(TURN_SERVERS);

  // Teste: no console, rode  __SALA_SO_RELAY = true  e entre na chamada. Isso
  // proíbe o caminho direto, então a conexão só fecha se o TURN estiver mesmo
  // funcionando. Se conectar, o TURN está certo; se der "falhou", está errado.
  window.__SALA_SO_RELAY = false;

  // Busca as credenciais de curta duração e guarda até perto de expirarem.
  // Se o endpoint falhar, cai para a lista fixa em vez de impedir a chamada.
  let ICE_CACHE = { servers: null, expiraEm: 0 };

  async function resolverIceServers(){
    if (!TURN_ENDPOINT) return ICE_SERVERS;
    if (ICE_CACHE.servers && Date.now() < ICE_CACHE.expiraEm) return ICE_CACHE.servers;
    try{
      // AbortController corta a conexão de verdade; sem ele o navegador
      // continuaria segurando o pedido depois do prazo.
      const corta = new AbortController();
      const alarme = setTimeout(() => corta.abort(), 6000);
      const r = await fetch(TURN_ENDPOINT, { headers: { 'Accept': 'application/json' }, signal: corta.signal })
        .finally(() => clearTimeout(alarme));
      if (window.__anotarRelogio) window.__anotarRelogio(r);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      // O Cloudflare devolve iceServers como um objeto único; outros serviços
      // devolvem uma lista. Aceita os dois formatos.
      const bruto = Array.isArray(j.iceServers) ? j.iceServers
                  : (j.iceServers ? [j.iceServers] : []);
      // A entrada só de STUN vem com username/credential em branco. Campo vazio
      // faz alguns navegadores recusarem a lista inteira, então some com eles.
      const extra = bruto.map(s => {
        const limpo = { urls: s.urls };
        if (s.username) limpo.username = s.username;
        if (s.credential) limpo.credential = s.credential;
        return limpo;
      }).filter(s => s.urls && s.urls.length);
      if (!extra.length) throw new Error('resposta sem iceServers');
      const ttl = Number(j.ttl) > 0 ? Number(j.ttl) : 3600;
      ICE_CACHE.servers = ICE_SERVERS.concat(extra);
      ICE_CACHE.expiraEm = Date.now() + ttl * 800;   // renova a 80% do TTL
      window.__SALA_TURN = 'ok (' + extra.length + ' servidor(es), ttl ' + ttl + 's)';
      return ICE_CACHE.servers;
    }catch(e){
      console.error('[sala] falha ao buscar credenciais TURN:', e);
      // Traduz o erro para algo que sirva de diagnóstico na hora do aperto.
      window.__SALA_TURN = 'FALHOU: ' + (
        e.name === 'AbortError'      ? 'sem resposta em 6s (a rede parece bloquear o servidor)' :
        /Failed to fetch/.test(e.message || '') ? 'não alcancei o servidor (rede bloqueando ou fora do ar)' :
        e.message);
      // Avisa uma vez só: se a função ainda não foi publicada, não faz sentido
      // encher a tela de alerta a cada entrada na chamada.
      if (!ICE_CACHE.avisou){
        ICE_CACHE.avisou = true;
        showToast('Sem servidor TURN configurado — a chamada usa conexão direta e pode falhar em rede corporativa.');
      }
      return ICE_SERVERS;
    }
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function slugify(s){
    return s.toLowerCase().trim()
      .replace(/[^a-z0-9à-ÿ\s-]/g,'')
      .replace(/\s+/g,'-')
      .slice(0,24) || 'canal';
  }

  function colorFor(name){
    const palette = ['#ff9f5b','#5fd98a','#5b9dff','#ff6b9e','#c78cff','#ffd15b','#5be0d9'];
    let h = 0;
    for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return palette[h % palette.length];
  }

  function initials(name){
    return (name||'?').trim().slice(0,2).toUpperCase();
  }

  function timeFmt(ts){
    const d = new Date(ts);
    return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }

  function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

  // Nada aqui pode esperar para sempre. Rede que ENGOLE o pacote (em vez de
  // recusar) deixa um fetch pendurado por minutos, e o pedido de microfone
  // fica parado se a permissão nunca for respondida — nos dois casos a pessoa
  // vê "carregando" sem fim. Melhor seguir sem o recurso do que travar.
  function comPrazo(promessa, ms, aoEstourar){
    let t;
    return Promise.race([
      promessa,
      new Promise(res => { t = setTimeout(() => res({ __prazo: true }), ms); })
    ]).then(r => {
      clearTimeout(t);
      if (r && r.__prazo){
        console.warn('[sala] prazo de ' + ms + 'ms estourado: ' + (aoEstourar || 'operação'));
        return { __prazo: true };
      }
      return r;
    });
  }

  async function safeGet(key, shared, retries){
    retries = retries === undefined ? 2 : retries;
    for (let i=0; i<=retries; i++){
      try{
        const r = await window.storage.get(key, shared);
        return r ? r.value : null;
      }catch(e){
        if (i === retries) return null;
        await sleep(400 * (i+1));
      }
    }
    return null;
  }
  async function safeSet(key, value, shared, retries){
    retries = retries === undefined ? 2 : retries;
    for (let i=0; i<=retries; i++){
      try{
        await window.storage.set(key, value, shared);
        return true;
      }catch(e){
        console.error('storage set failed', key, e);
        if (i === retries) return false;
        await sleep(500 * (i+1));
      }
    }
    return false;
  }

  async function safeDelete(key, shared){
    try{ await window.storage.delete(key, shared); return true; }catch(e){ return false; }
  }

  async function safeGetChanged(keys, desde){
    try{ return await window.storage.getChanged(keys, desde); }catch(e){ return null; }
  }

  async function safeGetMany(keys){
    try{ return await window.storage.getMany(keys); }catch(e){ return null; }
  }

  async function safeList(prefix){
    try{ return await window.storage.list(prefix); }catch(e){ return null; }
  }

  async function safeDeleteOlderThan(prefix, ms){
    try{ await window.storage.deleteOlderThan(prefix, ms); return true; }catch(e){ return false; }
  }

  async function safeDeletePrefix(prefix, keepalive){
    try{ await window.storage.deletePrefix(prefix, keepalive); return true; }catch(e){ return false; }
  }

  async function entrarComSenhaLocal(apelido, senha, err){
    if (senha !== ROOM_PASSWORD){ err.textContent = 'Senha incorreta.'; return; }
    if (!apelido){ err.textContent = 'Digite um apelido.'; return; }

  async function submitNick(){
    const input = document.getElementById('nick-input');
    const val = input.value.trim();
    const err = document.getElementById('nick-err');
    const pass = document.getElementById('pass-input').value;

    if (MODO_LOGIN){
      const btn = document.getElementById('nick-btn');
      if (!val || !pass){
        err.textContent = MODO_CONTA ? 'Preencha usuário e senha.' : 'Preencha a senha e um apelido.';
        return;
      }
      err.textContent = 'Verificando…';
      btn.disabled = true;
      try{
        const corta = new AbortController();
        const alarme = setTimeout(() => corta.abort(), 10000);
        const r = await fetch(AUTH_ENDPOINT, {
          signal: corta.signal,
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(MODO_CONTA ? { usuario: val, senha: pass }
                                          : { apelido: val, senha: pass })
        });
        clearTimeout(alarme);
        const j = await r.json().catch(() => ({}));
        // Rede de segurança: se o serviço de login não está configurado, está
        // fora do ar, ou respondeu algo que não dá para entender, a sala NÃO
        // pode ficar trancada — cai para a senha embutida. Vale para uma sala
        // interna: melhor entrar com a senha antiga do que ninguém entrar.
        const semServico = !j || (!j.ok && !j.erro) || /nao configurad/.test(j.erro || '');
        if (semServico){
          console.warn('[sala] serviço de login indisponível (' + (j.erro || 'resposta inválida') + ') — usando a senha embutida');
          btn.disabled = false;
          return entrarComSenhaLocal(val, pass, err);
        }
        if (!r.ok || !j.ok){
          err.textContent = j.erro === 'usuario ou senha invalidos' ? 'Usuário ou senha inválidos.'
            : j.erro === 'senha da sala incorreta' ? 'Senha da sala incorreta.'
            : (j.erro || 'Não foi possível entrar.');
          btn.disabled = false;
          return;
        }
        await safeSet('sessao', JSON.stringify({ usuario: j.usuario, exp: j.exp, token: j.token }), false);
        state.nickname = j.usuario;
        err.textContent = '';
        await boot();
      }catch(e){
        console.warn('[sala] não consegui falar com o serviço de login — usando a senha embutida', e);
        btn.disabled = false;
        return entrarComSenhaLocal(val, pass, err);
      }
      return;
    }

    if (pass !== ROOM_PASSWORD){ err.textContent = 'Senha incorreta.'; return; }
    if (!val){ err.textContent = 'Digite um apelido.'; return; }
    if (val.length > 24){ err.textContent = 'Apelido muito longo.'; return; }
    err.textContent = '';
    await safeSet('nickname', val, false);
    state.nickname = val;
    await boot();
  }

  function renderMessages(arr, forceScroll){

  // ---------- MEMBROS / PRESENÇA (texto) ----------
  // Uma linha por pessoa (mb:<apelido>) em vez de um mapa numa linha só. Antes
  // todos reescreviam a MESMA linha a cada ciclo, e o banco serializa isso —
  // com gente suficiente virava fila de espera. Agora cada um escreve a sua.
  async function heartbeatAndLoadMembers(){
    const now = window.agoraServidor ? window.agoraServidor() : Date.now();
    const [, rows] = await Promise.all([
      safeSet('mb:' + state.nickname, String(now), true, 1),
      safeList('mb:')
    ]);
    if (!rows) return;
    const members = {};
    for (const r of rows){
      const nome = r.key.slice(3);
      const ts = Number(r.value) || 0;
      if (nome && now - ts <= STALE_MEMBER_MS) members[nome] = ts;
    }
    members[state.nickname] = now;
    state.members = members;
    renderMembers();
  }
